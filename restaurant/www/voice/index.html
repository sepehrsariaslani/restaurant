<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>صدای مشتری</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: Tahoma, "Vazirmatn", sans-serif; background: #f2ece4; color: #3b3128; padding: 16px;
  }
  .card {
    width: 100%; max-width: 540px; background: #fff; border-radius: 20px; padding: 28px 24px;
    box-shadow: 0 14px 40px rgba(59, 49, 40, 0.12);
  }
  h1 { font-size: 1.25rem; margin: 0 0 6px; }
  .sub { font-size: 0.85rem; color: #8a7f71; margin-bottom: 20px; }
  label { display: block; font-size: 0.85rem; margin: 12px 0 6px; color: #5d5347; }
  input, textarea, select {
    width: 100%; padding: 12px 14px; border: 1.5px solid #e4dccd; border-radius: 12px; font-size: 0.95rem;
    font-family: inherit; background: #fbf9f5; color: #3b3128; outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: #b96a3c; }
  textarea { min-height: 100px; resize: vertical; }
  button.primary {
    width: 100%; margin-top: 20px; padding: 14px; border: 0; border-radius: 14px; cursor: pointer;
    background: #b96a3c; color: #fff; font-size: 1rem; font-family: inherit; font-weight: 700;
  }
  button.primary:disabled { opacity: 0.55; cursor: default; }
  .types { display: flex; gap: 8px; flex-wrap: wrap; }
  .types button {
    padding: 9px 16px; border-radius: 999px; border: 1.5px solid #e4dccd; background: #fbf9f5;
    cursor: pointer; font-family: inherit; font-size: 0.85rem;
  }
  .types button.sel { background: #b96a3c; border-color: #b96a3c; color: #fff; }
  .msg { margin-top: 14px; font-size: 0.9rem; text-align: center; }
  .msg.err { color: #a44437; }
  .hidden { display: none; }
  .thanks { text-align: center; padding: 30px 0 10px; }
  .thanks .big { font-size: 3rem; }
</style>
</head>
<body>
<div class="card" id="step-form">
  <h1>صدای مشتری</h1>
  <div class="sub">شکایت، انتقاد، پیشنهاد یا درخواست خود را با ما در میان بگذارید؛ پاسخ‌گوی شما هستیم.</div>

  <label>نوع پیام</label>
  <div class="types" id="types"></div>

  <label>موضوع *</label>
  <input id="f-subject" maxlength="140" placeholder="مثلاً تأخیر در ارسال سفارش" />

  <label>متن پیام *</label>
  <textarea id="f-message" placeholder="توضیح کامل را اینجا بنویسید..."></textarea>

  <label>شماره موبایل *</label>
  <input id="f-mobile" placeholder="09xxxxxxxxx" inputmode="tel" />

  <label>نام (اختیاری)</label>
  <input id="f-name" placeholder="نام و نام خانوادگی" />

  <label>کد سفارش (اختیاری — در صورت مرتبط‌بودن پیام با سفارش)</label>
  <input id="f-order" placeholder="مثلاً SO-1024" />

  <button class="primary" id="btn-submit" onclick="submitVoice()">ارسال پیام</button>
  <div class="msg err hidden" id="form-err"></div>
</div>

<div class="card hidden" id="step-done">
  <div class="thanks">
    <div class="big">💌</div>
    <h1>پیام شما ثبت شد!</h1>
    <div class="sub">از اینکه ما را در جریان گذاشتید سپاسگزاریم؛ به‌زودی رسیدگی می‌کنیم.</div>
    <div class="sub">کد پیگیری: <b id="voice-code"></b></div>
  </div>
</div>

<script>
let voiceType = "شکایت";

function api(method, args) {
  const body = new URLSearchParams();
  Object.keys(args || {}).forEach((k) => {
    const v = args[k];
    body.append(k, typeof v === "object" ? JSON.stringify(v) : v);
  });
  return fetch("/api/method/restaurant.api." + method, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8" },
    body: body.toString(),
  }).then(async (r) => {
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      let msg = "خطا در ارتباط با سرور";
      try {
        const sm = JSON.parse(data._server_messages || "[]");
        if (sm.length) msg = JSON.parse(sm[0]).message || msg;
      } catch (e) {}
      throw new Error(msg);
    }
    return data.message;
  });
}

function showErr(id, text) {
  const el = document.getElementById(id);
  el.textContent = text || "";
  el.classList.toggle("hidden", !text);
}

function buildTypes() {
  const box = document.getElementById("types");
  box.innerHTML = "";
  ["شکایت", "انتقاد", "پیشنهاد", "درخواست", "تقدیر"].forEach((t) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = t;
    b.classList.toggle("sel", t === voiceType);
    b.onclick = () => {
      voiceType = t;
      box.querySelectorAll("button").forEach((el) => el.classList.toggle("sel", el.textContent === t));
    };
    box.appendChild(b);
  });
}

function submitVoice() {
  const payload = {
    type: voiceType,
    subject: document.getElementById("f-subject").value.trim(),
    message: document.getElementById("f-message").value.trim(),
    mobile: document.getElementById("f-mobile").value.trim(),
    customer_name: document.getElementById("f-name").value.trim(),
    order_code: document.getElementById("f-order").value.trim(),
  };
  if (!payload.subject || !payload.message || !payload.mobile) {
    showErr("form-err", "موضوع، متن پیام و شماره موبایل الزامی است.");
    return;
  }
  document.getElementById("btn-submit").disabled = true;
  api("submit_public_voice", { payload })
    .then((res) => {
      document.getElementById("voice-code").textContent = res.voice || "-";
      document.getElementById("step-form").classList.add("hidden");
      document.getElementById("step-done").classList.remove("hidden");
    })
    .catch((e) => { showErr("form-err", e.message); })
    .finally(() => { document.getElementById("btn-submit").disabled = false; });
}

buildTypes();
</script>
</body>
</html>
