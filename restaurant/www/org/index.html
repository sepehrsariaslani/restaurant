<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>پورتال حسابداری سازمان</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: Tahoma, "Vazirmatn", sans-serif;
    background: #f2ece4; color: #3b3128; padding: 16px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  .card {
    background: #fff; border-radius: 20px; padding: 26px 22px; margin-bottom: 16px;
    box-shadow: 0 14px 40px rgba(59, 49, 40, 0.12);
  }
  h1 { font-size: 1.25rem; margin: 0 0 6px; }
  h2 { font-size: 1rem; margin: 0 0 12px; }
  .sub { font-size: 0.85rem; color: #8a7f71; margin-bottom: 18px; }
  label { display: block; font-size: 0.85rem; margin: 12px 0 6px; color: #5d5347; }
  input {
    width: 100%; padding: 12px 14px; border: 1.5px solid #e4dccd; border-radius: 12px;
    font-size: 0.95rem; font-family: inherit; background: #fbf9f5; color: #3b3128; outline: none;
  }
  input:focus { border-color: #b96a3c; }
  button.primary {
    width: 100%; margin-top: 20px; padding: 14px; border: 0; border-radius: 14px; cursor: pointer;
    background: #b96a3c; color: #fff; font-size: 1rem; font-family: inherit; font-weight: 700;
  }
  button.primary:disabled { opacity: 0.55; cursor: default; }
  button.ghost {
    padding: 9px 16px; border-radius: 12px; border: 1.5px solid #e4dccd; background: #fff;
    cursor: pointer; font-family: inherit; font-size: 0.85rem; margin-inline-start: 8px;
  }
  button.ghost.sel { background: #2f6f5c; border-color: #2f6f5c; color: #fff; }
  .msg { margin-top: 14px; font-size: 0.9rem; text-align: center; }
  .msg.err { color: #a44437; }
  .hidden { display: none; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .kpi { background: #fbf9f5; border: 1px solid #efe8db; border-radius: 14px; padding: 12px; }
  .kpi .v { font-size: 1.15rem; font-weight: 800; color: #2f6f5c; }
  .kpi .v.warn { color: #a44437; }
  .kpi .l { font-size: 0.75rem; color: #8a7f71; margin-top: 4px; }
  .bar { height: 8px; background: #efe8db; border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .bar > span { display: block; height: 100%; background: #2f6f5c; border-radius: 99px; }
  .bar > span.over { background: #a44437; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th, td { padding: 8px 10px; border-bottom: 1px solid #efe8db; text-align: right; }
  th { color: #8a7f71; font-weight: 600; font-size: 0.75rem; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .head-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 0.72rem; background: #efe8db; }
  .empty { text-align: center; color: #8a7f71; padding: 18px 0; font-size: 0.85rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="step-auth">
    <h1>پورتال حسابداری سازمان</h1>
    <div class="sub">دسترسی آنلاین به وضعیت اعتبار، سفارش‌ها و فاکتورهای سازمانی</div>
    <label>شناسه سازمان (نام مشتری سازمانی)</label>
    <input id="f-org" placeholder="مثلاً شرکت نمونه" />
    <label>کد دسترسی پورتال</label>
    <input id="f-code" placeholder="کد دسترسی اعلام‌شده" />
    <button class="primary" id="btn-login" onclick="portalLogin()">ورود</button>
    <div class="msg err hidden" id="auth-err"></div>
  </div>

  <div id="step-main" class="hidden">
    <div class="card">
      <div class="head-row">
        <div>
          <h1 id="org-name"></h1>
          <div class="sub" id="org-meta" style="margin-bottom:0"></div>
        </div>
        <button class="ghost" onclick="location.reload()">خروج</button>
      </div>
      <div class="kpis" id="kpis"></div>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="ghost sel" id="tab-orders" onclick="showTab('orders')">سفارش‌ها</button>
        <button class="ghost" id="tab-invoices" onclick="showTab('invoices')">فاکتورها</button>
      </div>
      <div id="orders-pane">
        <div class="head-row" style="margin-bottom:10px">
          <h2>سفارش‌های سازمانی</h2>
          <button class="ghost" onclick="loadOrders()">بروزرسانی</button>
        </div>
        <div style="overflow-x:auto">
          <table>
            <thead><tr><th>کد سفارش</th><th>تاریخ</th><th>معین</th><th>مبلغ (ریال)</th><th>وضعیت</th><th>فاکتور</th></tr></thead>
            <tbody id="orders-body"></tbody>
          </table>
        </div>
        <div class="empty hidden" id="orders-empty">سفارشی یافت نشد.</div>
      </div>
      <div id="invoices-pane" class="hidden">
        <div class="head-row" style="margin-bottom:10px">
          <h2>فاکتورهای سازمانی</h2>
          <button class="ghost" onclick="loadInvoices()">بروزرسانی</button>
        </div>
        <div style="overflow-x:auto">
          <table>
            <thead><tr><th>شماره فاکتور</th><th>تاریخ</th><th>مبلغ (ریال)</th><th>مانده (ریال)</th><th>وضعیت</th></tr></thead>
            <tbody id="invoices-body"></tbody>
          </table>
        </div>
        <div class="empty hidden" id="invoices-empty">فاکتوری یافت نشد.</div>
      </div>
    </div>
  </div>
</div>

<script>
let orgId = "", accessCode = "";

function api(method, args) {
  const body = new URLSearchParams();
  Object.keys(args || {}).forEach((k) => {
    const v = args[k];
    body.append(k, typeof v === "object" ? JSON.stringify(v) : v);
  });
  return fetch("/api/method/restaurant.api." + method, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8" },
    body: body.toString(),
  }).then(async (r) => {
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      let msg = "خطا در ارتباط با سرور";
      try {
        const sm = JSON.parse(data._server_messages || "[]");
        if (sm.length) msg = JSON.parse(sm[0]).message || msg;
      } catch (e) {}
      throw new Error(msg);
    }
    return data.message;
  });
}

function fmt(n) {
  try { return Number(n || 0).toLocaleString("fa-IR"); } catch (e) { return String(n || 0); }
}

function showErr(id, text) {
  const el = document.getElementById(id);
  el.textContent = text || "";
  el.classList.toggle("hidden", !text);
}

function portalLogin() {
  orgId = document.getElementById("f-org").value.trim();
  accessCode = document.getElementById("f-code").value.trim();
  if (!orgId || !accessCode) { showErr("auth-err", "شناسه سازمان و کد دسترسی الزامی است."); return; }
  document.getElementById("btn-login").disabled = true;
  api("org_portal_login", { organization: orgId, access_code: accessCode })
    .then((res) => {
      document.getElementById("org-name").textContent = res.organization_label || orgId;
      document.getElementById("org-meta").textContent =
        "قرارداد: " + (res.contract_no || "-") + " · صدور فاکتور: " + (res.invoice_mode || "-");
      document.getElementById("step-auth").classList.add("hidden");
      document.getElementById("step-main").classList.remove("hidden");
      loadOverview();
      loadOrders();
      loadInvoices();
    })
    .catch((e) => { showErr("auth-err", e.message); })
    .finally(() => { document.getElementById("btn-login").disabled = false; });
}

function kpi(label, value, warn) {
  return '<div class="kpi"><div class="v' + (warn ? " warn" : "") + '">' + value + '</div><div class="l">' + label + "</div></div>";
}

function capBar(used, cap) {
  if (!cap) return "";
  const pct = Math.min(Math.round((used / cap) * 100), 100);
  const over = used >= cap;
  return '<div class="bar"><span class="' + (over ? "over" : "") + '" style="width:' + pct + '%"></span></div>';
}

function loadOverview() {
  api("org_portal_overview", { organization: orgId, access_code: accessCode }).then((res) => {
    const kpis = [];
    kpis.push(kpi("مصرف امروز / سقف روزانه", fmt(res.day_usage) + (res.daily_order_cap ? " / " + fmt(res.daily_order_cap) : ""), res.daily_order_cap && res.day_usage >= res.daily_order_cap));
    kpis.push(kpi("مصرف این ماه / سقف ماهانه", fmt(res.month_usage) + (res.monthly_order_cap ? " / " + fmt(res.monthly_order_cap) : ""), res.monthly_order_cap && res.month_usage >= res.monthly_order_cap));
    kpis.push(kpi("مبلغ فاکتورنشده (" + (res.uninvoiced_count || 0) + " سفارش)", fmt(res.uninvoiced_total), false));
    document.getElementById("kpis").innerHTML = kpis.join("") +
      '<div class="kpi" style="grid-column:1/-1"><div class="l">وضعیت مصرف نسبت به سقف‌ها</div>' +
      capBar(res.day_usage, res.daily_order_cap) + capBar(res.month_usage, res.monthly_order_cap) + "</div>";
  });
}

function showTab(which) {
  document.getElementById("orders-pane").classList.toggle("hidden", which !== "orders");
  document.getElementById("invoices-pane").classList.toggle("hidden", which !== "invoices");
  document.getElementById("tab-orders").classList.toggle("sel", which === "orders");
  document.getElementById("tab-invoices").classList.toggle("sel", which === "invoices");
}

function loadOrders() {
  api("org_portal_orders", { organization: orgId, access_code: accessCode }).then((res) => {
    const rows = res.orders || [];
    document.getElementById("orders-empty").classList.toggle("hidden", rows.length > 0);
    document.getElementById("orders-body").innerHTML = rows.map((o) =>
      "<tr><td>" + o.name + "</td><td>" + (o.date || "-") + "</td><td>" + (o.org_member || "-") +
      "</td><td>" + fmt(o.grand_total) + "</td><td><span class=\"pill\">" + (o.status || "-") +
      "</span></td><td>" + (o.org_invoice || "—") + "</td></tr>"
    ).join("");
  });
}

function loadInvoices() {
  api("org_portal_invoices", { organization: orgId, access_code: accessCode }).then((res) => {
    const rows = res.invoices || [];
    document.getElementById("invoices-empty").classList.toggle("hidden", rows.length > 0);
    document.getElementById("invoices-body").innerHTML = rows.map((v) =>
      "<tr><td>" + v.name + "</td><td>" + (v.posting_date || "-") + "</td><td>" + fmt(v.grand_total) +
      "</td><td>" + fmt(v.outstanding_amount) + "</td><td><span class=\"pill\">" + (v.status || "-") + "</span></td></tr>"
    ).join("");
  });
}
</script>
</body>
</html>
